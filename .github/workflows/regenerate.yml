name: Regenerate PluginMaster
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write
concurrency:
  group: pluginmaster
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: distribution
      - uses: actions/checkout@v5
        with:
          repository: NiGuangOwO/DalamudMCP
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test index generation
        run: python -m unittest discover -s distribution/tests -p "test_*.py"
      - name: Reconcile published release and regenerate index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git -C distribution config user.name "github-actions[bot]"
          git -C distribution config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python source/build/release_pipeline.py sync --distribution distribution --tag latest --push
